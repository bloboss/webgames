<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Sort Puzzle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <h1>W A T E R &nbsp; S O R T</h1>

        <div id="controls">
            <div id="difficulty-select">
                <button class="diff-btn active" data-diff="easy">Easy</button>
                <button class="diff-btn" data-diff="medium">Medium</button>
                <button class="diff-btn" data-diff="hard">Hard</button>
            </div>
            <div id="game-actions">
                <button id="btn-new">New Game</button>
                <button id="btn-reset">Reset</button>
                <button id="btn-undo">Undo</button>
                <button id="btn-hint">Hint</button>
            </div>
        </div>

        <div id="info-bar">
            <span id="move-counter">Moves: 0</span>
            <span id="timer-display">Time: 00:00</span>
        </div>

        <div id="bottles-container"></div>

        <div id="message"></div>

        <div id="stats-section">
            <button id="btn-toggle-stats">Show Stats</button>
            <button id="btn-toggle-history">Show History</button>
            <div id="stats-display" class="hidden"></div>
            <div id="history-display" class="hidden"></div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
